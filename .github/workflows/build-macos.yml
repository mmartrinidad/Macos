name: Build macOS ISO
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'macOS version'
        required: true
        default: '15'
        type: choice
        options:
          - '15'
          - '14'
          - '13'
          - '12'
          - '11'
          - '10.15'
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Find full installer version
        id: version
        run: |
          echo "🔍 Buscando versiones completas disponibles para macOS ${{ github.event.inputs.version }}..."
          softwareupdate --list-full-installers
          FULL_VERSION=$(softwareupdate --list-full-installers | grep -E "Version: ${{ github.event.inputs.version }}(\.| )" | head -n 1 | sed -E 's/.*Version: ([0-9.]+),.*/\1/')
          if [ -z "$FULL_VERSION" ]; then
            echo "❌ No se encontró una versión completa para ${{ github.event.inputs.version }}"
            exit 1
          fi
          echo "✅ Versión completa encontrada: $FULL_VERSION"
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Download macOS installer
        run: |
          echo "📥 Descargando macOS versión $FULL_VERSION..."
          sudo softwareupdate --fetch-full-installer --full-installer-version "$FULL_VERSION"

      - name: Find installer path
        id: finder
        run: |
          INSTALLER_PATH=$(find /Applications -name "Install macOS*.app" -maxdepth 1 | head -n 1)
          if [ -z "$INSTALLER_PATH" ]; then
            echo "❌ No se encontró el instalador en /Applications"
            exit 1
          fi
          echo "INSTALLER_PATH=$INSTALLER_PATH" >> $GITHUB_ENV
          echo "📂 Instalador encontrado: $INSTALLER_PATH"

      - name: Create sparse disk image (local storage, not RAM)
        run: |
          echo "💾 Creando imagen de disco sparse en almacenamiento local..."
          hdiutil create -o /tmp/mac_install -size 18g -type SPARSE -fs HFS+J -volname "InstallDisk" -layout SPUD
          hdiutil attach /tmp/mac_install.sparseimage -noverify -mountpoint /Volumes/InstallDisk

      - name: Create installer media on disk image
        run: |
          echo "🛠️ Creando medio de instalación..."
          sudo "$INSTALLER_PATH/Contents/Resources/createinstallmedia" --volume /Volumes/InstallDisk --nointeraction

      - name: Convert disk image to ISO
        run: |
          echo "🔨 Convirtiendo a ISO..."
          VOLUME_PATH=$(find /Volumes -maxdepth 1 -iname "Install macOS*" | head -n 1)
          if [ -z "$VOLUME_PATH" ]; then
            echo "❌ No se encontró el volumen de instalación"
            exit 1
          fi
          echo "📂 Volumen encontrado: $VOLUME_PATH"
          hdiutil eject "$VOLUME_PATH"
          hdiutil convert /tmp/mac_install.sparseimage -format UDTO -o /tmp/macOS.iso -verbose
          mv /tmp/macOS.iso.cdr /tmp/macOS.iso
          echo "✅ ISO creado exitosamente"

      - name: Upload ISO
        uses: actions/upload-artifact@v4.4.3
        with:
          name: macOS_${{ env.FULL_VERSION }}.iso
          path: /tmp/macOS.iso
